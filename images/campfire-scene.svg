@keyframes em{0%{opacity:0;transform:translate(0,0)}12%{opacity:.95}100%{opacity:0;transform:translate(var(--dx),-520px)}}
@media (prefers-reduced-motion:reduce){.st,.glow,.fl,.em{animation:none} .em{opacity:0}}
</style>
